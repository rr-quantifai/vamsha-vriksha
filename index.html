['g69','g69s',[]],['g43','g43s',[]],['g46','g46s',[]]
];


/* ── Lookup maps (O(1) instead of linear scans) ── */
var UByParent={},UByChild={},UBySpouse={};
U.forEach(function(u){
  if(!UByParent[u[0]])UByParent[u[0]]=[];
  UByParent[u[0]].push(u);
  if(u[1])UBySpouse[u[1]]=u;
  u[2].forEach(function(c){UByChild[c]=u});
});

function getUnions(pid){return UByParent[pid]||[]}
function getParentUnion(pid){return UByChild[pid]||null}
function getMarriedInto(pid){return UBySpouse[pid]||null}


var FM={
R:{name:'Rudra',color:'#B594D4',root:'r1',gotra:'Kanva',gotraDesc:"Shakuntala’s foster father. Shakuntala is the daughter of Vishvamitra \u2014 a Saptarishi of the Swayambhuva Manvantara and the Vaivasvata Manvantara \u2014 and the Maneka Apsara. Shakuntala and her husband Dushyanta fathered Bharata \u2014 the progenitor of the Kaurava lineage. Kanva's father is Medhatithi, whose lineage traces back to Angirasa \u2014 a Saptarishi of the Swayambhuva Manvantara"},
D:{name:'Dutta',color:'#C4856B',root:'d1',gotra:'Gautama',gotraDesc:"A Saptarishi of the Vaivasvata Manvantara and the brother of Brihaspati \u2014 guru of the Devas. Gautama's father is Angirasa \u2014 a Saptarishi of the Swayambhuva Manvantara"},
M:{name:'Mitra',color:'#7BA97B',root:'m1',gotra:'Vishvamitra',gotraDesc:"A Saptarishi of the Vaivasvata Manvantara and the drashta of the Gayatri Mantra. Born as Kaushika \u2014 a Chandravanshi raja \u2014 he attained the title of a Brahmarishi and the name Vishvamitra through rigorous penance. This transformation was recognized by his rival-turned-mentor Vashishtha \u2014 a Saptarishi of the Swayambhuva Manvantara and the Vaivasvata Manvantara"},
G:{name:'Ghosh',color:'#C4AC6B',root:'g1',gotra:'Soukalin',gotraDesc:"Makaranda Ghosh \u2014 the patriarch of the Ghosh lineage within the Bengali Kayastha community \u2014 established the Soukalin lineage. Makaranda's father is Shriharsa, whose lineage traces back to Kashyapa \u2014 a Saptarishi of the Vaivasvata Manvantara. Kashyapa's father is Marichi \u2014 a Saptarishi of the Swayambhuva Manvantara"}
};


var NOTES={r6s:'A founding member of the East Bengal Football Club',m4s2:{type:'parents',father:'Nabendra Nath Guha',mother:'Nibhanani'}};
var MC={m:'#6BA3C9',f:'#C97BA3'};
var COL_A='#E08585',COL_SP='#6BBFC4';


function traceToRoot(pid,root){
  if(pid===root)return new Set();
  var ids=new Set(),c=pid,seen=new Set();
  while(true){
    if(seen.has(c))return null;seen.add(c);
    var pu=getParentUnion(c);if(!pu)return null;
    var parentId=pu[0];
    var parentUnions=getUnions(parentId);
    for(var i=0;i<parentUnions.length;i++){
      if(parentUnions[i][2].indexOf(c)!==-1){ids.add(parentId+'-'+i);break}
    }
    if(parentId===root)return ids;c=parentId;
  }
}


function resolveInFamily(pid,fk){
  var root=FM[fk].root,direct=traceToRoot(pid,root);
  if(direct)return{path:direct,flash:pid};
  for(var i=0;i<U.length;i++){
    if(U[i][1]===pid&&U[i][0]){var pp=traceToRoot(U[i][0],root);if(pp)return{path:pp,flash:U[i][0]}}
  }
  return{path:new Set(),flash:pid};
}


function getDescendantKeys(pid){
  var keys=new Set();
  var unions=getUnions(pid);
  unions.forEach(function(u,i){
    keys.add(pid+'-'+i);
    u[2].forEach(function(cid){
      getDescendantKeys(cid).forEach(function(k){keys.add(k)});
    });
  });
  return keys;
}


function renderNote(note){
  if(typeof note==='string')return note;
  if(note.type==='parents')return e(React.Fragment,null,
    e('span',{style:{fontWeight:700}},'Father:'),' ',note.father,e('br'),
    e('span',{style:{fontWeight:700}},'Mother:'),' ',note.mother,
    e('span',{style:{color:'#6B7280',fontStyle:'italic'}},' \u2014'));
  return null;
}


var isFullUnk=function(n){return n.startsWith('Wife of')||n.startsWith('Husband of')||n.startsWith('First wife of')};


function PersonLine(props){
  var p=props.p,fs=props.fontSize,color=props.color,extra=props.extraAfter;

      e('span',{style:{color:'#6B7280',fontStyle:'italic'}},n),extra);
  }
  if(p[3]==='p'){
    return e('span',{style:{fontSize:fs,lineHeight:'20px'}},

}


function Badge(props){

/* ── ChildLabel: CSS-only animation, no intervals ── */
function ChildLabel(props){
  var count=props.count,isExp=props.isExpanded,fc=props.familyColor,onToggle=props.onToggle;
  var label=count+(count===1?' child':' children');
  return e('div',{onClick:function(ev){ev.stopPropagation();onToggle()},

          e('span',{style:{position:'absolute',color:fc+'cc',animation:'altA 2.8s ease-in-out infinite'}},label),
          e('span',{style:{position:'absolute',color:'#6B7280',animation:'altB 2.8s ease-in-out infinite'}},'Click to explore')
        )
  );
}


function TreeNode(props){
  var pid=props.pid,depth=props.depth,expanded=props.expanded,toggleExpand=props.toggleExpand;
  var activeFamily=props.activeFamily,onSwitchFamily=props.onSwitchFamily;
  var noteOpen=props.noteOpen,setNoteOpen=props.setNoteOpen,flashId=props.flashId;
  var p=P[pid];if(!p)return null;
  var unions=getUnions(pid);
  var marriedInto=unions.length===0?getMarriedInto(pid):null;
  var familyColor=FM[activeFamily].color;
  var note=NOTES[pid];
  var isFlashing=flashId===pid;
  var flashRef=useRef(null);


  useEffect(function(){
    if(isFlashing&&flashRef.current){
      setTimeout(function(){flashRef.current&&flashRef.current.scrollIntoView({behavior:'smooth',block:'center'})},150);
    }
  },[isFlashing]);


  var childProps={expanded:expanded,toggleExpand:toggleExpand,activeFamily:activeFamily,
    onSwitchFamily:onSwitchFamily,noteOpen:noteOpen,setNoteOpen:setNoteOpen,flashId:flashId};


  return e('div',{style:{marginLeft:depth>0?14:0}},
    e('div',{ref:flashRef,
      style:{padding:'10px 14px',marginBottom:1,borderRadius:8,
        animation:isFlashing?'flash 0.6s ease-in-out 4':'none'}},
      e('div',{style:{lineHeight:'22px'}},
        e(PersonLine,{p:p,fontSize:14,extraAfter:e(React.Fragment,null,
          p[3]==='a'?e('span',{style:{fontWeight:700,color:COL_A,fontSize:14,marginLeft:4}},'A'):null,
          p[3]==='s'?e('span',{style:{fontWeight:700,color:COL_SP,fontSize:14,marginLeft:4}},'SP'):null,
          note?e('span',{onClick:function(ev){ev.stopPropagation();setNoteOpen(noteOpen===pid?null:pid)},
            style:{fontWeight:700,color:familyColor,fontSize:10,marginLeft:5,cursor:'pointer',
              textDecoration:'underline',textDecorationStyle:'dotted',textUnderlineOffset:2}},'INFO'):null,
          marriedInto&&P[marriedInto[0]]?e(Badge,{text:FM[P[marriedInto[0]][2]].name,
            color:FM[P[marriedInto[0]][2]].color,
            onClick:function(ev){ev.stopPropagation();onSwitchFamily(P[marriedInto[0]][2],marriedInto[0])}}):null
        )})
      ),
      noteOpen===pid&&note?e('div',{style:{fontSize:11.5,color:'#9CA3AF',marginTop:6,padding:'6px 10px',
        background:'#161B22',borderRadius:8,border:'1px solid #30363D',lineHeight:1.6,textAlign:'justify'}},renderNote(note)):null,
      unions.map(function(u,i){
        var sp=u[1]?P[u[1]]:null;
        var spNote=u[1]?NOTES[u[1]]:null;
        var crossFam=sp&&sp[2]!==activeFamily?FM[sp[2]]:null;
        var unionKey=pid+'-'+i;
        var isUnionExpanded=expanded.has(unionKey);
        return e('div',{key:i,style:{marginTop:6}},
          sp?e('div',{style:{lineHeight:'20px'}},
            e('span',{style:{fontWeight:700,color:'#8B949E',fontSize:12.5}},'U'),' ',
            e(PersonLine,{p:sp,fontSize:12.5,color:'#9CA3AF',extraAfter:e(React.Fragment,null,
              sp[3]==='a'?e('span',{style:{fontWeight:700,color:COL_A,fontSize:12.5,marginLeft:4}},'A'):null,
              spNote?e('span',{onClick:function(ev){ev.stopPropagation();setNoteOpen(noteOpen===u[1]?null:u[1])},
                style:{fontWeight:700,color:familyColor,fontSize:10,marginLeft:5,cursor:'pointer',
                  textDecoration:'underline',textDecorationStyle:'dotted',textUnderlineOffset:2}},'INFO'):null,
              crossFam?e(Badge,{text:crossFam.name,color:crossFam.color,
                onClick:function(ev){ev.stopPropagation();onSwitchFamily(sp[2],u[1])}}):null
            )})
          ):null,
          noteOpen===u[1]&&spNote?e('div',{style:{fontSize:11.5,color:'#9CA3AF',marginTop:5,padding:'6px 10px',
            background:'#161B22',borderRadius:8,border:'1px solid #30363D',lineHeight:1.6,textAlign:'justify'}},renderNote(spNote)):null,
          u[2].length>0?e(ChildLabel,{count:u[2].length,isExpanded:isUnionExpanded,familyColor:familyColor,
            onToggle:function(){toggleExpand(unionKey)}}):null
        );
      })
    ),
    unions.map(function(u,ui){
      var uKey=pid+'-'+ui;
      return expanded.has(uKey)?e('div',{key:ui,style:{borderLeft:'1px solid #E6EDF3',marginLeft:9}},
        u[2].map(function(cid){
          return e(TreeNode,Object.assign({key:cid,pid:cid,depth:depth+1},childProps));
        })
      ):null;
    })
  );
}


function App(){
  var s1=useState(null),activeFamily=s1[0],setActiveFamily=s1[1];
  var s2=useState(''),searchQ=s2[0],setSearchQ=s2[1];
  var s3=useState(false),showSearch=s3[0],setShowSearch=s3[1];
  var s4=useState(null),noteOpen=s4[0],setNoteOpen=s4[1];
  var s5=useState(false),showGotra=s5[0],setShowGotra=s5[1];
  var s6=useState(new Set()),expanded=s6[0],setExpanded=s6[1];
  var s7=useState(null),flashId=s7[0],setFlashId=s7[1];
  var searchRef=useRef(null);


  var results=useMemo(function(){
    if(searchQ.length<2)return[];
    var q=searchQ.toLowerCase();
    return Object.entries(P).filter(function(x){
      return!isFullUnk(x[1][0])&&x[1][0].toLowerCase().indexOf(q)!==-1;
    }).map(function(x){
      var id=x[0],p=x[1],pre=null,name=p[0],post=null;
      if(p[3]==='p')pre='\u2014 ';
      else if(p[0].indexOf(' ')===-1)post=' \u2014';
      return{id:id,name:name,pre:pre,post:post,g:p[1],fam:p[2]};
    }).slice(0,12);
  },[searchQ]);


  var toggleExpand=useCallback(function(unionKey){
    setExpanded(function(prev){
      var n=new Set(prev);
      if(n.has(unionKey)){
        n.delete(unionKey);
        var collapseId=unionKey.substring(0,unionKey.lastIndexOf('-'));
        var uIdx=parseInt(unionKey.substring(unionKey.lastIndexOf('-')+1));
        var collapseUnions=getUnions(collapseId);
        if(collapseUnions[uIdx]){
          collapseUnions[uIdx][2].forEach(function(cid){
            getDescendantKeys(cid).forEach(function(k){n.delete(k)});
          });
        }
      }else{
        var pid=unionKey.substring(0,unionKey.lastIndexOf('-'));
        prev.forEach(function(k){
          if(k.substring(0,k.lastIndexOf('-'))===pid&&k!==unionKey){
            n.delete(k);
            var sibIdx=parseInt(k.substring(k.lastIndexOf('-')+1));
            var sibUnions=getUnions(pid);
            if(sibUnions[sibIdx]){
              sibUnions[sibIdx][2].forEach(function(cid){
                getDescendantKeys(cid).forEach(function(dk){n.delete(dk)});
              });
            }
          }
        });
        n.add(unionKey);
      }
      return n;
    });
  },[]);


  var handleSearchSelect=useCallback(function(id,fam){
    setActiveFamily(fam);
    var r=resolveInFamily(id,fam);
    setExpanded(new Set(r.path));
    setFlashId(r.flash);setTimeout(function(){setFlashId(null)},2400);
    setSearchQ('');setShowSearch(false);
  },[]);


  var handleSwitchFamily=useCallback(function(fam,personId){
    setActiveFamily(fam);
    if(personId){
      var r=resolveInFamily(personId,fam);
      setExpanded(new Set(r.path));
      setFlashId(r.flash);setTimeout(function(){setFlashId(null)},2400);
    }
  },[]);


  var fm=activeFamily?FM[activeFamily]:null;
  var isLanding=activeFamily===null;


  return e('div',{style:{minHeight:'100vh',background:'#0D1117',color:'#E6EDF3',
    fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',
    display:'flex',flexDirection:'column',maxWidth:600,margin:'0 auto'}},


    isLanding?null:
    e('div',{style:{position:'sticky',top:0,zIndex:100,backdropFilter:'blur(20px)',
      WebkitBackdropFilter:'blur(20px)',background:'#0D1117dd',borderBottom:'1px solid #1C2128',padding:'12px 16px',
      animation:'fadeIn 0.6s ease'}},
      e('div',{style:{position:'relative'}},
        e('div',{onClick:function(){setShowSearch(true);setTimeout(function(){searchRef.current&&searchRef.current.focus()},50)},
          style:{background:'#161B22',border:'1px solid #30363D',borderRadius:12,
            padding:'11px 14px',fontSize:14,color:showSearch?'#E6EDF3':'#6B7280',
            display:'flex',alignItems:'center',gap:9,cursor:'text'}},
          e('span',{style:{opacity:0.4,fontSize:18}},'\u2315'),
          showSearch?e('input',{ref:searchRef,value:searchQ,
            onChange:function(ev){setSearchQ(ev.target.value)},
            onBlur:function(){setTimeout(function(){setShowSearch(false)},200)},
            placeholder:'Type a name',
            style:{background:'none',border:'none',outline:'none',color:'#E6EDF3',
              fontSize:14,width:'100%',fontFamily:'inherit'}}):e('span',null,'Find yourself')
        ),
        results.length>0&&showSearch?e('div',{style:{
          position:'absolute',top:'100%',left:0,right:0,marginTop:4,
          background:'#161B22',border:'1px solid #30363D',borderRadius:12,
          overflow:'hidden',zIndex:200,boxShadow:'0 8px 32px #00000066'}},
          results.map(function(r){
            return e('div',{key:r.id,onMouseDown:function(){handleSearchSelect(r.id,r.fam)},
              style:{padding:'12px 14px',cursor:'pointer',display:'flex',
                alignItems:'center',gap:6,borderBottom:'1px solid #1C2128',
                fontSize:13,lineHeight:'20px'},
              onMouseEnter:function(ev){ev.currentTarget.style.background='#1C2128'},
              onMouseLeave:function(ev){ev.currentTarget.style.background='transparent'}},
              e('span',{style:{fontWeight:700,color:MC[r.g]}},r.g==='f'?'XX':'XY'),
              e('span',{style:{flex:1}},
                r.pre?e('span',{style:{color:'#6B7280',fontStyle:'italic'}},r.pre):null,
                e('span',null,r.name),
                r.post?e('span',{style:{color:'#6B7280',fontStyle:'italic'}},r.post):null
              ),
              e('span',{style:{fontSize:9,color:'#6B7280',textTransform:'uppercase',letterSpacing:0.8,fontWeight:500}},FM[r.fam].name)
            );
          })
        ):null
      )
    ),


    isLanding?
    e('div',{style:{flex:1,display:'flex',alignItems:'center',justifyContent:'center',paddingBottom:45}},
      e('div',{style:{textAlign:'center',color:'#555E68',fontSize:14,letterSpacing:0.3}},
        'Select a family tree to continue')
    ):
    e('div',{style:{flex:1,overflowY:'auto',paddingBottom:90,paddingTop:4,animation:'fadeIn 0.6s ease'}},
      e('div',{onClick:function(){setShowGotra(!showGotra)},
        style:{margin:'8px 12px',padding:'10px 14px',borderRadius:10,
          background:fm.color+'0A',border:'1px solid '+fm.color+'18',cursor:'pointer'}},
        e('div',{style:{fontSize:12,color:fm.color,fontWeight:500,lineHeight:'20px'}},
          'Gotra lineage \u2014 '+fm.gotra,
          e('span',{style:{float:'right',display:'inline-block',transition:'transform 0.15s',
            transform:showGotra?'rotate(90deg)':'rotate(0)',fontSize:9}},'\u25B6')
        ),
        showGotra?e('div',{style:{fontSize:11.5,color:'#9CA3AF',marginTop:8,lineHeight:1.6,textAlign:'justify'}},fm.gotraDesc):null
      ),
      e('div',{style:{position:'relative',marginLeft:12}},
        e('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:1,background:fm.color}}),
        e('div',{style:{marginLeft:14}},
          e(TreeNode,{pid:fm.root,depth:0,expanded:expanded,toggleExpand:toggleExpand,
            activeFamily:activeFamily,onSwitchFamily:handleSwitchFamily,
            noteOpen:noteOpen,setNoteOpen:setNoteOpen,flashId:flashId})
        )
      )
    ),


    e('div',{style:{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',
      width:'100%',maxWidth:600,zIndex:100}},
      isLanding?null:
      e('div',{style:{background:'#0D1117',borderTop:'1px solid #1C2128',
        padding:'8px 16px',display:'flex',flexWrap:'wrap',gap:14,justifyContent:'center',
        fontSize:11,color:'#555E68',lineHeight:'18px',animation:'fadeIn 0.6s ease'}},
        e('span',null,e('span',{style:{fontWeight:700,color:'#6BA3C9'}},'XY'),' Male'),
        e('span',null,e('span',{style:{fontWeight:700,color:'#C97BA3'}},'XX'),' Female'),
        e('span',null,e('span',{style:{fontWeight:700,color:'#8B949E'}},'U'),' Spouse'),
        e('span',null,e('span',{style:{fontWeight:700,color:COL_A}},'A'),' Adopted'),
        e('span',null,e('span',{style:{fontWeight:700,color:COL_SP}},'SP'),' Single parent')
      ),
      e('div',{style:{display:'flex',background:'#0D1117',borderTop:'1px solid #1C2128'}},
        Object.entries(FM).map(function(x){
          var k=x[0],f=x[1];
          var isActive=activeFamily===k;
          return e('div',{key:k,onClick:function(){setActiveFamily(k);setNoteOpen(null);setShowGotra(false);setExpanded(new Set());setFlashId(null)},
            style:{flex:1,padding:'15px 4px',textAlign:'center',cursor:'pointer'}},
            e('div',{style:{fontSize:13,
              fontWeight:isLanding?600:isActive?600:400,
              color:isLanding?'#FFFFFF':isActive?f.color:'#555E68',
              textTransform:'uppercase',
              letterSpacing:1,
              transition:'all 0.3s',
              animation:isLanding?'tabPulse 1.5s ease-in-out infinite':'none'}},f.name)
          );
        })
      )
    )
  );
}


ReactDOM.render(e(App),document.getElementById('root'));
</script>
